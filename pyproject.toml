[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-flow-observer"
version = "0.1.0"
description = "沪深300四只宽基ETF份额与单位净值的采集、版本和校验骨架。不是交易系统。"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "etf-flow-observer"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
etf-flow-observer = "etf_flow_observer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
